  raw_lines: ["释放挥击攻击前方扇形区域，击中时造成 346% 武器攻击伤害。", "该技能受斩击几率影响，使其有可能以斩击形态释放。该技能释放斩击时生成 3 道烈焰，击中时造成 346% 武器攻击伤害。技能范围使该技能斩击生成的烈焰数量增加。多道烈焰伤害可以命中同一个敌人。", "该技能全部物理伤害转化为火焰伤害。", "挥击：", "造成 346% 武器攻击伤害", "斩击：", "造成 346% 武器攻击伤害", "每 115% 对该技能范围的加成，+2 火浪道数", "每 115% 对该技能范围的加成，+30% 火浪距离", "多道火浪的伤害可以叠加", "该技能的霰弹效应衰减系数为 50%", "该技能 100% 物理伤害转化为火焰伤害"]
