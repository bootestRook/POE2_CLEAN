  source: "tlidb"
  tlidb_id: "Burning_Shot"
  display_level: 20
  raw_lines: ["释放该技能向前发射 1 个烈焰箭，造成 256% 武器攻击伤害，且造成的点燃伤害额外增加。", "该技能击中点燃的敌人时引发爆炸，对半径 3 米内敌人造成相当于 100% 该敌人受到的每秒点燃伤害的真实伤害，并造成 5-5 间接火焰伤害。", "该技能全部物理伤害转化为火焰伤害。", "燃烧射击：", "造成 256% 武器攻击伤害", "基础发射 1 个投射物", "该技能额外 +30% 点燃伤害", "该技能 100% 物理伤害转化为火焰伤害", "该技能 +25% 点燃几率 (Lv1:25)", "该技能击中点燃的敌人时引发爆炸，对半径 3 米内敌人造成相当于 100% 该敌人受到的每秒点燃伤害的真实伤害；该效果对同一敌人有 5 秒冷却时间"]
