  source: "tlidb"
  tlidb_id: "Corrosive_Shot"
  display_level: 20
  raw_lines: ["释放该技能向前抛射一个侵蚀弹，侵蚀弹接触目标时产生爆炸，造成 95% 武器攻击伤害。", "未分裂的侵蚀弹接触目标时还会生成侵蚀地面，对其中的敌人每秒造成 57 持续混沌伤害，并使其中敌人受到的该技能的伤害额外增加。", "该技能造成的凋零伤害更高。", "该技能全部物理伤害转化为混沌伤害。", "爆炸：", "造成 95% 武器攻击伤害", "该技能 +30% 凋零几率", "该技能额外 +30% 凋零伤害", "该技能 100% 物理伤害转化为混沌伤害", "侵蚀地面：", "侵蚀地面持续 3 秒", "伤害状态持续 2 秒，每秒造成 57 持续混沌伤害"]
